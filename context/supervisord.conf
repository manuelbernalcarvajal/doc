[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

# 1. Rclone (Gateway S3 Cifrado Interno)
[program:rclone]
command=/bin/sh -c "exec rclone --config /tmp/rclone.conf serve s3 crypt: --addr 127.0.0.1:9000 --auth-key monolith_internal,monolith_internal_secret_98765 --no-modtime 2>&1 | sed -u 's/^/[rclone] /'"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 2. PocketBase (Backend y API)
[program:pocketbase]
command=/bin/sh -c "exec /usr/local/bin/pocketbase serve --http=127.0.0.1:8090 --dir=/pb_data --hooksDir=/pb_hooks --publicDir=/pb_public 2>&1 | sed -u 's/^/[pocketbase] /'"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 3. Litestream (Replicador continuo de SQLite al S3 cifrado)
[program:litestream]
command=/bin/sh -c "exec litestream replicate -config /etc/litestream.yml 2>&1 | sed -u 's/^/[litestream] /'"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 4. Caddy (Reverse Proxy, HTTPS y Seguridad de rutas)
[program:caddy]
command=/bin/sh -c "exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | sed -u 's/^/[caddy] /'"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 5. Demonio de Mantenimiento y Purga S3
[program:maintenance]
command=/bin/sh -c "exec /maintenance.sh"
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
