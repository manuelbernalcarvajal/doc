services:
  monolito:
    image: ghcr.io/manuelbernalcarvajal/doc:latest
    container_name: nube_monolito
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - pb_data:/pb_data
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

volumes:
  pb_data:
    driver: local
  caddy_data:
  caddy_config:
