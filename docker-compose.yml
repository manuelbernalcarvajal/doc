services:
  monolito:
    build:
      context: ./context
    container_name: nube_monolito
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Si quieres probarlo "en RAM" o completamente efímero, comenta este volumen:
      - ./pb_data:/pb_data
      - ./context/pb_hooks:/pb_hooks
      - ./context/pb_public:/pb_public
